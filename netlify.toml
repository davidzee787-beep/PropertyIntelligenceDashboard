[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — every path serves index.html so the React router takes over.
# (HashRouter doesn't strictly need this, but it's harmless and protects us
# if we ever switch back to BrowserRouter.)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
